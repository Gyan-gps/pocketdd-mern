# Joins the Laravel Sail network and reuses its MySQL container (same data volume).
# Start MySQL first:  cd ../pocketdd-admin && docker compose up -d mysql
services:
  api:
    build: ./api
    env_file: .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - ./api/src:/app/src
      - ./api/test:/app/test
      - ./api/scripts:/app/scripts
      - ../pocketdd-admin/public:/laravel/public
    command: npm run dev
    networks: [sail]
  web:
    build: ./web
    environment:
      API_URL: http://api:4000
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
    command: npm run dev
    depends_on: [api]
    networks: [sail]
networks:
  sail:
    external: true
    name: pocketdd-admin_sail
